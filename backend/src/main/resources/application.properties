spring.application.name=lilimi-backend

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Stripe integration is disabled unless explicitly enabled
lilimi.payments.stripe.enabled=${STRIPE_ENABLED:false}
lilimi.payments.stripe.api-key=${STRIPE_API_KEY:}

lilimi.payments.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

# Product image storage
lilimi.media.storage-directory=${MEDIA_STORAGE_DIRECTORY:./var/media}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=105MB
