<section class="contact" aria-labelledby="contact-title">
  <div class="container">
    <div class="contact__content">
      <h1 id="contact-title" class="heading-1">{{ 'contact.title' | transloco }}</h1>
      <p class="contact__description">{{ 'contact.description' | transloco }}</p>
      <div class="contact__actions">
        <a class="contact__email" href="mailto:contact@lilimistudio.com">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
            <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.5" />
            <path d="m4 6 8 6 8-6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>contact&#64;lilimistudio.com</span>
        </a>
        <a class="button button--primary contact__cta"
          [routerLink]="['/', transloco.getActiveLang(), 'project-inquiry']">
          {{ 'contact.cta' | transloco }}
        </a>
      </div>
    </div>
  </div>
</section>
