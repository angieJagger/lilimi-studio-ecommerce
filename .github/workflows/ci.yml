name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Plan required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.plan.outputs.frontend }}
      backend: ${{ steps.plan.outputs.backend }}
      images: ${{ steps.plan.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select checks and validate whitespace
        id: plan
        run: python3 .github/scripts/ci-plan.py

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test -- --watch=false

      - name: Build frontend
        run: npm run build

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Backend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests and package backend
        run: bash ./mvnw -B --no-transfer-progress verify


  images:
    name: Verify ${{ matrix.service }} image
    needs: [changes, frontend, backend]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.images == 'true' &&
      (needs.frontend.result == 'success' ||
       (needs.changes.outputs.frontend == 'false' && needs.frontend.result == 'skipped')) &&
      (needs.backend.result == 'success' ||
       (needs.changes.outputs.backend == 'false' && needs.backend.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          load: true
          pull: true
          tags: ghcr.io/angiejagger/lilimi-${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Report all image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/angiejagger/lilimi-${{ matrix.service }}:sha-${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: '0'
          timeout: '10m'
        env:
          TRIVY_IMAGE_SRC: docker

      - name: Block fixable image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/angiejagger/lilimi-${{ matrix.service }}:sha-${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          timeout: '10m'
        env:
          TRIVY_IMAGE_SRC: docker

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_REF: ghcr.io/angiejagger/lilimi-${{ matrix.service }}:sha-${{ github.sha }}
        run: docker push "$IMAGE_REF"

  ci-result:
    name: CI result
    needs: [changes, frontend, backend, images]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          IMAGES_REQUIRED: ${{ needs.changes.outputs.images }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]] || exit 1

          check_job() {
            local name="$1" required="$2" result="$3"
            if [[ "$required" == "true" && "$result" == "success" ]]; then
              echo "$name passed."
            elif [[ "$required" == "false" && "$result" == "skipped" ]]; then
              echo "$name was intentionally skipped."
            else
              echo "$name failed validation: required=$required, result=$result"
              exit 1
            fi
          }

          check_job frontend "$FRONTEND_REQUIRED" "$FRONTEND_RESULT"
          check_job backend "$BACKEND_REQUIRED" "$BACKEND_RESULT"
          check_job images "$IMAGES_REQUIRED" "$IMAGES_RESULT"
          echo "All required CI jobs passed."
